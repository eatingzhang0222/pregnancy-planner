<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="孕晚期">
<meta name="theme-color" content="#FBF6F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>孕晚期手帐</title>
<link rel="stylesheet" href="style.css?v=2026.11.26-7">
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>
<nav class="tabs" aria-label="主导航">
  <button data-tab="today" class="on"><span>◐</span>今天</button>
  <button data-tab="plan"><span>▤</span>日程</button>
  <button class="tab-add" data-act="open-chat" aria-label="记一笔"><i>✎</i>记一笔</button>
  <button data-tab="food"><span>❀</span>营养</button>
  <button data-tab="set"><span>⚙</span>设置</button>
</nav>
<section class="chat-panel" id="chat" aria-label="记一笔">
  <header class="chat-head">
    <button class="icon-btn" data-act="close-chat" aria-label="关闭">×</button>
    <b>记一笔</b>
    <button class="btn sm ghost" data-act="chat-clear">清空</button>
  </header>
  <div class="chat-log" id="chat-log"></div>
  <div class="chat-attach" id="chat-attach"></div>
  <footer class="chat-bar">
    <label class="chat-ico" aria-label="上传图片">📷<input type="file" accept="image/*" hidden id="chat-file"></label>
    <button class="chat-ico" id="chat-web" data-act="chat-web" aria-label="联网">🌐</button>
    <textarea id="chat-in" rows="1" placeholder="吃了什么、约了什么、想问什么…"></textarea>
    <button class="chat-ico chat-send" data-act="chat-send" aria-label="发送">↑</button>
  </footer>
</section>
<div class="sheet-mask" id="mask"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<div class="toast" id="toast"></div>
<script src="data.js?v=2026.11.26-7"></script>
<script src="meds.js?v=2026.11.26-7"></script>
<script src="app.js?v=2026.11.26-7"></script>
<script src="chat.js?v=2026.11.26-7"></script>
</body>
</html>
